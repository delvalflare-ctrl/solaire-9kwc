name: Alertes Solaires Push
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-solar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node alerte.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WINDOW_WATTS: ${{ vars.WINDOW_WATTS || secrets.WINDOW_WATTS || '500' }}
          PUSH_WATTS: ${{ vars.PUSH_WATTS || secrets.PUSH_WATTS || '800' }}
          MORNING_PUSH_TIME: ${{ vars.MORNING_PUSH_TIME || secrets.MORNING_PUSH_TIME || '06:30' }}
          REALTIME_WINDOW: ${{ vars.REALTIME_WINDOW || secrets.REALTIME_WINDOW || '06:00-20:00' }}
      - name: Mettre a jour data.json
        run: |
          if [ -f data.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git diff --staged --quiet || git commit -m "Mise a jour donnees solaires"
            git push
          fi
          
